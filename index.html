<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIC Showcase</title>
<style>
  :root { --bg: #14171b; --tx: #f2ece3; --tx3: rgba(242,236,227,.48); --line: rgba(242,236,227,.09); --red: #f0695c; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--tx); font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; padding: 96px clamp(16px, 5vw, 64px); line-height: 1.7; }
  h1 { font-size: clamp(36px, 6vw, 64px); font-weight: 900; }
  p { color: var(--tx3); margin-top: 8px; }
  ul { list-style: none; margin-top: 48px; padding: 0; max-width: 960px; border-top: 1px solid var(--line); }
  a { display: grid; grid-template-columns: 240px 1fr; gap: 24px; padding: 24px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; align-items: center; }
  a img { width: 100%; border-radius: 10px; aspect-ratio: 16/9; object-fit: cover; }
  a b { font-size: 22px; } a span { display: block; color: var(--tx3); font-size: 14px; } a code { color: var(--red); font-size: 12px; }
  @media (max-width: 640px) { a { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <h1>AIC Showcase</h1>
  <p>用 AI 生成的產業概念提案片。品牌皆為虛構</p>
  <ul>
    <li><a href="hotpot-lastslice/"><img src="hotpot-lastslice/media/sb/F02_S2_wide.jpg" alt=""><div><code>餐飲・2026-11</code><b>滾一鍋「最後一片肉」</b><span>25 秒西部片對決，最後一片肉被滑手機的朋友淡定夾走</span></div></a></li>
  </ul>
</body>
</html>
